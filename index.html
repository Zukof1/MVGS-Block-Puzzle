<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Block Puzzle — a free block-dropping puzzle game with Levels, Endless, and a Daily Challenge. Playable offline.">
    <meta name="theme-color" content="#1a1a2e">
    <title>Block Puzzle Game</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="main-menu" class="menu-screen">
        <h1>Block Puzzle</h1>
        <button id="levels-button" class="menu-button">Levels Mode</button>
        <button id="endless-button" class="menu-button">Endless Mode</button>
        <button id="daily-button" class="menu-button menu-button-secondary">Daily Challenge</button>
    </div>

    <div id="level-select-menu" class="menu-screen hidden">
        <div class="level-select-header">
            <h1>Select Level</h1>
            <button id="back-to-main-menu" class="menu-button">Back</button>
        </div>
        <div id="level-grid" class="level-grid">
            </div>
    </div>

    <div id="game-container" class="hidden">
        <div class="game-header">
            <div class="score-container">
                <div class="score-label">SCORE</div>
                <div id="score" class="score-value">0</div>
            </div>
            <div id="stone-goals-container" class="stone-goals-container">
            </div>
            <div class="currency-container">
                <img src="assets/ingame_currency.png" alt="Currency">
                <span id="currency-display">0</span>
            </div>
            <div class="level-container">
                <div class="level-label">LEVEL</div>
                <div id="level" class="level-value">1</div>
            </div>
            <div class="header-buttons">
                <button id="mute-button" class="game-button" aria-label="Mute sound">🔊</button>
                <button id="restart-button" class="game-button" aria-label="Restart level">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/></svg>
                </button>
                <button id="home-button" class="game-button" aria-label="Back to main menu">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
                </button>
            </div>
        </div>

        <div id="game-board" role="grid" tabindex="0" aria-label="Game board. Use arrow keys to move, Enter to place the selected block."></div>

        <div class="game-footer">
            <div id="power-ups-container">
                <div class="power-up-label">POWER-UPS</div>
                <div class="power-up-row">
                    <button id="swap-blocks-powerup" class="power-up-button">
                        <img src="assets/swap_icon.png" alt="">
                        <span>Swap <span class="power-up-cost">(50)</span></span>
                    </button>
                    <button id="bomb-powerup" class="power-up-button">
                        <img src="assets/bomb_icon.png" alt="">
                        <span>Bomb <span class="power-up-cost">(100)</span></span>
                    </button>
                    <button id="hammer-powerup" class="power-up-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.5 8.5a2.12 2.12 0 1 1-3-3L12 9"/><path d="M17.64 15 22 10.64"/><path d="m20.91 11.7-1.25-1.25c-.6-.6-.93-1.4-.93-2.25v-.86L16.01 4.6a5.56 5.56 0 0 0-3.94-1.64H9l.92.82A6.18 6.18 0 0 1 12 8.4v1.56l2 2h2.47l2.26 1.91"/></svg>
                        <span>Hammer <span class="power-up-cost">(150)</span></span>
                    </button>
                    <button id="undo-powerup" class="power-up-button" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
                        <span>Undo <span class="power-up-cost">(25)</span></span>
                    </button>
                    <button id="rotate-button" class="power-up-button" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                        <span>Rotate</span>
                    </button>
                </div>
            </div>
            <div class="next-blocks-label">NEXT BLOCKS <span class="hint-label">(tap to select, tap board to place)</span></div>
            <div id="block-container"></div>
        </div>
    </div>

    <div id="game-over-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Game Over</h2>
            <p>Your Score: <span id="final-score">0</span></p>
            <p id="best-score-row" class="hidden">Best: <span id="best-score">0</span></p>
            <div class="modal-buttons">
                <button id="modal-restart-button" class="menu-button">Play Again</button>
                <button class="menu-button menu-button-secondary modal-menu-button">Main Menu</button>
            </div>
        </div>
    </div>
    <div id="level-complete-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Level Complete!</h2>
            <div id="modal-stars" class="modal-stars" aria-label="Stars earned"></div>
            <p id="level-complete-message">Great job! Ready for the next challenge?</p>
            <div class="modal-buttons">
                <button id="next-level-button" class="menu-button">Next Level</button>
                <button class="menu-button menu-button-secondary modal-menu-button">Main Menu</button>
            </div>
        </div>
    </div>

    <script type="module" src="script/main.js"></script>
</body>
</html>
